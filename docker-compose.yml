name: hortai

x-common: &common
  restart: unless-stopped
  init: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 256
  networks: [app-network]
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *common
    image: postgres:18-alpine
    environment:
      TZ: ${TZ:-UTC}
      PGTZ: ${PGTZ:-UTC}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env.docker}
      AUTH_DATABASE_NAME: ${AUTH_DATABASE_NAME:?Set AUTH_DATABASE_NAME in .env.docker}
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /run/postgresql
      - /tmp
    read_only: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    <<: *common
    image: redis:8-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    read_only: true
    tmpfs: [/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-rest:
    <<: *common
    image: hiett/serverless-redis-http:0.0.10
    environment:
      SRH_MODE: ${SRH_MODE:-env}
      SRH_TOKEN: ${SRH_TOKEN:?Set SRH_TOKEN in .env.docker}
      SRH_CONNECTION_STRING: ${SRH_CONNECTION_STRING:-redis://redis:6379}
    read_only: true
    ports:
      - "127.0.0.1:8079:80"
    depends_on:
      redis:
        condition: service_healthy

  mailpit:
    <<: *common
    image: axllent/mailpit:v1.32.0
    read_only: true
    tmpfs: [/tmp]
    environment:
      MP_MAX_MESSAGES: "500"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5

  azurite:
    <<: *common
    image: mcr.microsoft.com/azure-storage/azurite:3.37.0
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /data
      - --skipApiVersionCheck
      - --disableProductStyleUrl
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "127.0.0.1:10000:10000"
    volumes:
      - azurite-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 10000 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  azurite-init:
    <<: *common
    image: mcr.microsoft.com/azure-cli:2.91.0
    restart: "no"
    pids_limit: 512
    read_only: true
    tmpfs:
      - /tmp
      - /root/.azure
    environment:
      STORAGE_AZURE_ACCOUNT_NAME: ${STORAGE_AZURE_ACCOUNT_NAME:?Set STORAGE_AZURE_ACCOUNT_NAME in .env.docker}
      STORAGE_AZURE_ACCOUNT_KEY: ${STORAGE_AZURE_ACCOUNT_KEY:?Set STORAGE_AZURE_ACCOUNT_KEY in .env.docker}
      STORAGE_AZURE_PUBLIC_CONTAINER: ${STORAGE_AZURE_PUBLIC_CONTAINER:?Set STORAGE_AZURE_PUBLIC_CONTAINER in .env.docker}
      STORAGE_AZURE_PRIVATE_CONTAINER: ${STORAGE_AZURE_PRIVATE_CONTAINER:?Set STORAGE_AZURE_PRIVATE_CONTAINER in .env.docker}
      DOCKER_APP_ORIGIN: ${DOCKER_APP_ORIGIN:-http://localhost:3000}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        export AZURE_STORAGE_CONNECTION_STRING="DefaultEndpointsProtocol=http;AccountName=$${STORAGE_AZURE_ACCOUNT_NAME};AccountKey=$${STORAGE_AZURE_ACCOUNT_KEY};BlobEndpoint=http://azurite:10000/$${STORAGE_AZURE_ACCOUNT_NAME};"
        az storage container create --name "$${STORAGE_AZURE_PUBLIC_CONTAINER}" --public-access blob --output none
        az storage container create --name "$${STORAGE_AZURE_PRIVATE_CONTAINER}" --public-access off --output none
        az storage cors clear --services b --output none
        az storage cors add --services b --methods GET HEAD PUT OPTIONS --origins "$${DOCKER_APP_ORIGIN}" --allowed-headers '*' --exposed-headers '*' --max-age 3600 --output none
        echo "Azurite initialized."
    depends_on:
      azurite:
        condition: service_healthy

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  azurite-data:
