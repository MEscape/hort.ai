# yaml-language-server: $schema=https://json.schemastore.org/pre-commit-config.json
# ==============================================================================
# PRE-COMMIT CONFIGURATION
# Run `pre-commit install` to set up git hook scripts.
# ==============================================================================

default_stages: [pre-commit]
fail_fast: false

repos:
  # ----------------------------------------------------------------------------
  # Basic File Hygiene & Private Key Detection
  # ----------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: detect-private-key

  # ----------------------------------------------------------------------------
  # Credential & Secret Detection (Gitleaks)
  # ----------------------------------------------------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.0
    hooks:
      - id: gitleaks

  # ----------------------------------------------------------------------------
  # Project Scripts (via package.json)
  # ----------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: format
        name: Format (npm run format)
        entry: npm run format
        language: system
        pass_filenames: false

      - id: lint-fix
        name: Lint & Auto-Fix (npm run lint:fix)
        entry: npm run lint:fix
        language: system
        pass_filenames: false
