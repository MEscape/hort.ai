name: Epic
description: A larger goal that is split into several sub-issues
title: "[Epic]: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        An epic groups related issues. The actual work happens in the sub-issues, which you attach via "Create sub-issue".
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome is reached when the epic is complete?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is explicitly not (MVP boundary)?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Completion criteria
      value: |
        - [ ] All sub-issues are closed
        - [ ] 
    validations:
      required: true
