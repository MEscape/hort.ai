name: Epic
description: Größeres Ziel, das in mehrere Sub-Issues aufgeteilt wird
title: "[Epic]: "
labels: ["type:epic"]
body:
  - type: markdown
    attributes:
      value: |
        Ein Epic bündelt zusammengehörige Issues. Die eigentliche Arbeit passiert in den Sub-Issues, die du über „Create sub-issue“ anhängst.
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: Welches Ergebnis ist erreicht, wenn das Epic abgeschlossen ist?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Umfang
      description: Was gehört dazu, und was ausdrücklich nicht (MVP-Grenze)?
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Abschlusskriterien
      value: |
        - [ ] Alle Sub-Issues sind geschlossen
        - [ ] 
    validations:
      required: true
