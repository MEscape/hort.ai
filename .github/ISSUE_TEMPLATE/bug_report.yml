name: Bug
description: Report a bug in Hort.ai
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please do not include personal data about children in the description, logs or screenshots.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Browser:
        - Node.js version:
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context / logs
      description: Screenshots, logs or stack traces (without secrets or children's data).
    validations:
      required: false
