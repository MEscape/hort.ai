name: Bug
description: Einen Fehler in Hort.ai melden
title: "[Bug]: "
labels: ["type:bug", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für die Fehlermeldung! Bitte keine personenbezogenen Daten von Kindern in Beschreibung, Logs oder Screenshots.
  - type: textarea
    id: description
    attributes:
      label: Beschreibung
      description: Was ist passiert?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. Gehe zu '...'
        2. Klicke auf '...'
        3. Siehe Fehler
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
      description: Was hättest du stattdessen erwartet?
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Umgebung
      value: |
        - Betriebssystem:
        - Browser:
        - Node.js-Version:
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Zusätzlicher Kontext / Logs
      description: Screenshots, Logs oder Stacktraces (ohne Geheimnisse oder Kinderdaten).
    validations:
      required: false
