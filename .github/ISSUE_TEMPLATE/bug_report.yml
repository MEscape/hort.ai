name: Bug Report
description: Create a report to help us improve Lumio
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report for the Lumio project! 
        Please provide as much information as possible to help us reproduce and fix the issue.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details (e.g. OS, Browser, Node.js version).
      value: |
        - OS: 
        - Browser: 
        - Node.js version: 
        - Docker version (if applicable):
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Context / Logs
      description: Add any other context about the problem here (e.g. screenshots, logs, stack traces).
    validations:
      required: false
