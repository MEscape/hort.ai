name: Feature
description: Suggest a new feature or product capability for Hort.ai
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your suggestion for Hort.ai! Please keep the issue small: one feature that can be built and tested within a few days.
  - type: textarea
    id: problem
    attributes:
      label: Problem / context
      description: Which problem does this solve, and for whom (child, parent, team)?
      placeholder: A child currently cannot ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? Describe the behavior, not the implementation.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable conditions that define when this issue is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Which other solutions did you consider, and why not?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Dependencies, relevant rules from docs/rules, sketches or links.
    validations:
      required: false
