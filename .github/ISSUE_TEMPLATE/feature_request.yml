name: Feature
description: Neue Funktion oder Produktfähigkeit für Hort.ai vorschlagen
title: "[Feature]: "
labels: ["type:feature", "status:triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für deinen Vorschlag für Hort.ai! Bitte halte das Issue klein: eine Funktion, die sich in wenigen Tagen umsetzen und testen lässt.
  - type: textarea
    id: problem
    attributes:
      label: Problem / Ausgangslage
      description: Welches Problem löst die Funktion, und für wen (Kind, Eltern, Team)?
      placeholder: Ein Kind kann aktuell nicht ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Gewünschte Lösung
      description: Was soll passieren? Beschreibe das Verhalten, nicht die Implementierung.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Akzeptanzkriterien
      description: Überprüfbare Bedingungen, wann das Issue fertig ist.
      value: |
        - [ ] 
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Betrachtete Alternativen
      description: Welche anderen Lösungen hast du erwogen, und warum nicht?
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Zusätzlicher Kontext
      description: Abhängigkeiten, relevante Regeln aus docs/rules, Skizzen oder Links.
    validations:
      required: false
