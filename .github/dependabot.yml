# ==============================================================================
# HORTAI - DEPENDABOT CONFIGURATION
# Automates weekly dependency & supply-chain updates across npm, GitHub Actions
# (pinned to commit SHAs; Dependabot rewrites the SHA and the version comment) and the
# pinned images in `docker-compose.yml`.
# ==============================================================================

version: 2

updates:
  # ----------------------------------------------------------------------------
  # 1. NPM Dependencies (`package.json` & `package-lock.json`)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    # Wait 3 days after a new npm release before opening a PR to avoid
    # zero-day compromised package versions on npm.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    labels:
      - "dependencies"
      - "npm"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "prisma"
          - "@prisma/*"
      # Prisma is pinned strictly; review its bumps in an isolated PR.
      prisma:
        patterns:
          - "prisma"
          - "@prisma/*"

  # ----------------------------------------------------------------------------
  # 2. GitHub Actions Workflows (`.github/workflows/*.yml` & `.github/actions/*`)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    # "/" covers `.github/workflows`; a composite action in a subdirectory must be listed.
    directories:
      - "/"
      - "/.github/actions/setup"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci(actions)"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"

  # ----------------------------------------------------------------------------
  # 3. Docker Compose Services (`docker-compose.yml`)
  # ----------------------------------------------------------------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "UTC"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "build(compose)"
    labels:
      - "dependencies"
      - "docker"
