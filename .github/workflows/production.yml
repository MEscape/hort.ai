# ==============================================================================
# HORTAI - PRODUCTION DEPLOYMENT PIPELINE
# Re-validates full CI on `main`, builds the Vercel production artifact first,
# applies database migrations (`app` & `auth`), deploys prebuilt output, and
# runs post-deploy health & schema contract verification.
# ==============================================================================

name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deployments at once.
# Never cancel a deployment halfway through migration/deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. Pre-Deploy CI Gate (Exact Commit Verification)
  # ----------------------------------------------------------------------------
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # Nested license job posts PR comments; a called workflow cannot exceed its caller's permissions.
      pull-requests: write

  # ----------------------------------------------------------------------------
  # 2. Build, Migrate, Deploy & Smoke-Test
  # ----------------------------------------------------------------------------
  deploy:
    name: Migrate & deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Configure this environment in GitHub:
    # - deployment branch: main
    # - optional required reviewers
    # - production secrets
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read

    env:
      VERCEL_CLI_VERSION: "65.0.0"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      # Direct production connections used by migrations.
      # These are separate from the least-privilege runtime connections.
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Ensure Prisma client & contracts exist since `--ignore-scripts` skips postinstall.
      - name: Generate Prisma client & contracts
        run: npm run db:generate

      # Make sure the migrations being deployed are the reviewed migrations.
      - name: Check migration files
        run: npm run db:migrate:check

      # 1) BUILD FIRST.
      # A broken build must never leave either database migrated.
      - name: Pull Vercel production settings
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod --token="$VERCEL_TOKEN"

      # 2) MIGRATE APPLICATION DATABASE.
      - name: Show application migration status
        run: npm run db:migrate:status

      - name: Apply application migrations
        run: npm run db:migrate:app

      # 3) MIGRATE AUTH DATABASE.
      - name: Apply auth migrations
        run: npm run db:migrate:auth

      # 4) DEPLOY THE PREBUILT ARTIFACT.
      - name: Deploy to Vercel
        id: deploy
        run: |
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 5) VERIFY DEPLOYMENT.
      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          # Optional Vercel Deployment Protection bypass.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=(-fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors)
          if [ -n "$BYPASS" ]; then
            args+=(-H "x-vercel-protection-bypass: $BYPASS")
          fi

          curl "${args[@]}" "$DEPLOY_URL/api/health" || {
            echo "::error::Smoke test failed for $DEPLOY_URL. Roll back with 'vercel rollback'."
            exit 1
          }

      # Verify the application database against the committed Prisma contract.
      - name: Verify application database
        run: npm run db:verify
