# ==============================================================================
# HORTAI - PRODUCTION DEPLOYMENT PIPELINE
# Re-validates full CI on `main`, builds the production deployment on Vercel
# (staged, domain NOT switched), applies database migrations (`app` & `auth`),
# runs post-deploy health & schema contract verification, and only then
# promotes the staged deployment to the production domain.
#
# The build runs REMOTELY on Vercel (no `vercel pull` / `vercel build` here),
# so sensitive Production environment variables are available to the build.
# Sensitive values cannot be pulled by the CLI ("[SENSITIVE]" placeholders).
# ==============================================================================

name: Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two production deployments at once.
# Never cancel a deployment halfway through migration/deploy.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # 1. Pre-Deploy CI Gate (Exact Commit Verification)
  # ----------------------------------------------------------------------------
  ci:
    name: CI
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # Nested license job posts PR comments; a called workflow cannot exceed its caller's permissions.
      pull-requests: write

  # ----------------------------------------------------------------------------
  # 2. Stage, Migrate, Verify & Promote
  # ----------------------------------------------------------------------------
  deploy:
    name: Migrate & deploy
    needs: ci
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # Configure this environment in GitHub:
    # - deployment branch: main
    # - optional required reviewers
    # - production secrets
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}

    permissions:
      contents: read

    env:
      VERCEL_CLI_VERSION: "65.0.0"
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      # Direct production connections used by migrations.
      # These are separate from the least-privilege runtime connections
      # configured in Vercel (which the remote build and runtime use).
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      AUTH_DATABASE_URL: ${{ secrets.PRODUCTION_AUTH_DATABASE_URL }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Ensure Prisma client & contracts exist since `--ignore-scripts` skips postinstall.
      - name: Generate Prisma client & contracts
        run: npm run db:generate

      # Make sure the migrations being deployed are the reviewed migrations.
      - name: Check migration files
        run: npm run db:migrate:check

      # `deploy` fails with "Project not found" when linked via the env ids (while `pull`
      # works with them). `pull` writes .vercel/project.json, so deploy links by file.
      - name: Link Vercel project
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production --token="$VERCEL_TOKEN"

      # 1) BUILD FIRST (STAGED).
      # Vercel builds remotely with the real Production env vars.
      # --skip-domain: the production domain is NOT switched yet.
      # A failed build fails this step, so neither database has been migrated.
      - name: Build & stage production deployment
        id: deploy
        run: |
          unset VERCEL_ORG_ID VERCEL_PROJECT_ID
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prod --skip-domain --yes --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # 2) MIGRATE APPLICATION DATABASE.
      - name: Show application migration status
        run: npm run db:migrate:status

      - name: Apply application migrations
        run: npm run db:migrate:app

      # 3) MIGRATE AUTH DATABASE.
      - name: Apply auth migrations
        run: npm run db:migrate:auth

      # 4) VERIFY THE STAGED DEPLOYMENT against the migrated databases.
      - name: Smoke test
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
          # Optional Vercel Deployment Protection bypass.
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          args=(-fsS --max-time 10 --retry 12 --retry-delay 5 --retry-all-errors)
          if [ -n "$BYPASS" ]; then
            args+=(-H "x-vercel-protection-bypass: $BYPASS")
          fi

          curl "${args[@]}" "$DEPLOY_URL/api/health" || {
            echo "::error::Smoke test failed for $DEPLOY_URL. It was NOT promoted; production is unchanged."
            exit 1
          }

      # Verify the application database against the committed Prisma contract.
      - name: Verify application database
        run: npm run db:verify

      # 5) GO LIVE only after every check above has passed.
      - name: Promote to production
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" promote "$DEPLOY_URL" --yes --token="$VERCEL_TOKEN"
