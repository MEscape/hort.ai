# ==============================================================================
# HORTAI - SECURITY & SUPPLY-CHAIN AUDIT PIPELINE
# Enforces dependency vulnerability checks, PR dependency diffs, and secret leaks.
# ==============================================================================

name: Security

on:
  schedule:
    - cron: "17 5 * * 1" # Weekly on Monday at 05:17 UTC
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ----------------------------------------------------------------------------
  # 1. NPM Audit (Production Dependencies)
  # ----------------------------------------------------------------------------
  npm-audit:
    name: npm audit (production deps)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: npm audit --omit=dev --audit-level=high

  # ----------------------------------------------------------------------------
  # 2. PR Dependency Diff Review (Blocks Newly Introduced Vulnerable Packages)
  # ----------------------------------------------------------------------------
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check dependency diff for vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  # ----------------------------------------------------------------------------
  # 3. Secret Scanning (Gitleaks)
  # ----------------------------------------------------------------------------
  secrets:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
